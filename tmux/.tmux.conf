# ── Terminal & Core ───────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc"  # true color

set -g history-limit 50000
set -g focus-events on
set -g mouse on

# ── Prefix & Input ───────────────────────────────────
set -g prefix2 C-Space
bind C-Space send-prefix -2

set -s escape-time 0                      # no delay for escape sequences
set -sg repeat-time 600
set -g display-time 4000

set -g status-keys emacs                  # emacs keys in status line

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# ── Display ──────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1

setw -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g renumber-windows on
set -g set-titles on

set -g monitor-activity off
set -g visual-activity on

# ── Navigation ───────────────────────────────────────
bind C-c new-session
# bind C-f command-prompt -p find-session 'switch-client -t %%'

bind C-f display-popup -E -w 25% -h 30% "tmux-sessionizer"

bind > swap-pane -D
bind < swap-pane -U

bind c new-window -c "#{pane_current_path}"
bind x kill-pane

# Window switching (Alt+N) — Ghostty maps Ctrl+N → Alt+N
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# ── Copy Mode ────────────────────────────────────────
bind Enter copy-mode
bind Space copy-mode
bind p paste-buffer

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Copy to macOS clipboard
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "\"\$TMUX_PROGRAM\" \${TMUX_SOCKET:+-S \"\$TMUX_SOCKET\"} save-buffer - | pbcopy"'

# ── Pane Borders ─────────────────────────────────────
# Catppuccin manages pane border colors; override lines/popup only
set -g pane-border-lines heavy

# Popup styling (tmux 3.3+)
set -g popup-border-style "fg=#cba6f7"
set -g popup-border-lines rounded

# ── Status Bar ───────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-justify "absolute-centre"
set -g status-left-length 100
set -g status-right-length 100

# ── Plugins ──────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# ── Plugin Config: Catppuccin ────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_flags "none"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""

# Session module: unified green pill with bold name
set -g @catppuccin_status_session_text_bg "#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}"
set -g @catppuccin_status_session_text_fg "#{E:@thm_crust}"
set -g @catppuccin_session_icon " "
set -g @catppuccin_session_text "#[bold]#S #[nobold]"

# Status line composition using catppuccin modules
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#[fg=#{E:@thm_overlay1}] %a %d %b %H:%M"

# ── Plugin Config: Continuum ─────────────────────────
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'

# ── TPM Bootstrap (must be last) ─────────────────────
run -b '~/.tmux/plugins/tpm/tpm'
